<!-- form-list.component.html -->
<div class="container mt-4">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">Saved Forms</h2>
      </div>
      <div class="card-body">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Title</th>
              <th>Last Updated</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let form of forms">
              <td>{{form.title}}</td>
              <td>{{form.updatedAt | date:'medium'}}</td>
              <td>
                <a [routerLink]="['/builder', form.id]" class="btn btn-sm btn-primary me-2">
                  <i class="bi bi-pencil"></i> Edit
                </a>
                <button (click)="deleteForm(form.id)" class="btn btn-sm btn-danger">
                  <i class="bi bi-trash"></i> Delete
                </button>
              </td>
            </tr>
            <tr *ngIf="forms.length === 0">
              <td colspan="3" class="text-center">No forms saved yet</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
